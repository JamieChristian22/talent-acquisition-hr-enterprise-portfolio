name: Secure service and accessibility quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  secure-api-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install secured-service and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-secure.txt bandit pip-audit
      - name: Run real authentication, RBAC and HTTP provider tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Static security scanning
        run: |
          bandit -q -r src/tahr/secure_service.py src/tahr/admin.py src/tahr/provider_clients.py -ll
          python scripts/security_preflight.py
      - name: Dependency vulnerability auditing
        run: pip-audit -r requirements-secure.txt
  browser-accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python service and browser test tools
        run: |
          python -m pip install -r requirements-secure.txt
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build ephemeral accounts and start LOCAL secured API
        env:
          TAHR_RUNTIME_DIR: ${{ runner.temp }}/tahr-runtime
          TAHR_TEST_LOGIN_FILE: ${{ runner.temp }}/tahr-browser-users.json
        run: |
          PYTHONPATH=src python scripts/prepare_secure_browser.py
          PYTHONPATH=src python -m tahr.secure_service >"${RUNNER_TEMP}/tahr-server.log" 2>&1 &
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8766/healthz && break
            sleep 1
          done
      - name: WCAG 2.2 automated axe-core and browser tests
        env:
          TAHR_TEST_LOGIN_FILE: ${{ runner.temp }}/tahr-browser-users.json
        run: npm run test:a11y
      - name: Save browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: secure-browser-a11y-report
          path: test-results/a11y-results.json
          if-no-files-found: ignore
